name: Stock screener

# Reruns the Top-100 / breakout screen every weekday after the US close and
# commits the reports so history accumulates in reports/stocks/history/.
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC, Mon-Fri (after 16:00 ET close)
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra tickers (comma-separated) beyond the S&P 500"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stock-screener
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements-stocks.txt

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: .cache/stocks
          key: stock-prices-${{ github.run_id }}
          restore-keys: stock-prices-

      - name: Run screener
        env:
          EXTRA: ${{ github.event.inputs.extra }}
        run: python -m stocks.cli --out reports/stocks --extra "$EXTRA" -v

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stocks
          if git diff --cached --quiet; then
            echo "No report changes"; exit 0
          fi
          AS_OF=$(python -c "import json;print(json.load(open('reports/stocks/latest.json'))['as_of'])")
          git commit -m "stocks: screener report for $AS_OF"
          git push

      - name: Summary
        run: |
          {
            echo "## Stock screener"
            sed -n '1,60p' reports/stocks/latest.md
          } >> "$GITHUB_STEP_SUMMARY"
